  .green{background:#2ea043; color:white;}
  .white{background:white; color:black;}
  .skills{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}

  .float-wa{position:fixed; bottom:20px; right:20px; background:#25D366; color:white; width:55px; height:55px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 4px 15px rgba(0,0,0,0.5); text-decoration:none;}
